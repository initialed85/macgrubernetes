name: Release

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: '1.26.5'

jobs:
  build:
    name: Build Macgrubernetes bundle
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Validate shell scripts
        run: for script in scripts/*.sh; do bash -n "$script"; done

      - name: Resolve latest component releases
        run: ./scripts/update.sh

      - name: Show integration lock
        run: cat components.lock

      - name: Test pinned component set
        run: make test

      - name: Build Darwin arm64 binaries
        run: make build

      - name: Package release
        env:
          VERSION: build-${{ github.run_number }}
        run: ./scripts/package-release.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: macgrubernetes-build-${{ github.run_number }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

      - name: Create build-numbered release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Macgrubernetes build ${{ github.run_number }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
