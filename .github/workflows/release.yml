name: Release

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: '1.26.5'

jobs:
  build:
    name: Build Darwin/${{ matrix.arch }} bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
            goarch: arm64
            rust_target: aarch64-apple-darwin
            deployment_target: ''
          - arch: amd64
            runner: macos-15-intel
            goarch: amd64
            rust_target: x86_64-apple-darwin
            deployment_target: '10.15'
    runs-on: ${{ matrix.runner }}
    env:
      MACGRUBER_GOARCH: ${{ matrix.goarch }}
      MACGRUBER_RUST_TARGET: ${{ matrix.rust_target }}
      MACGRUBER_MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
      MACGRUBER_BUILD_ROOT: .build/${{ matrix.arch }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Validate shell scripts
        run: for script in scripts/*.sh; do bash -n "$script"; done

      - name: Resolve latest component releases
        run: ./scripts/update.sh

      - name: Show integration lock
        run: cat components.lock

      - name: Test pinned component set
        run: make test

      - name: Build Darwin/${{ matrix.arch }} binaries
        run: make build

      - name: Inspect binary formats
        run: file "$MACGRUBER_BUILD_ROOT/bin"/*

      - name: Package release
        env:
          VERSION: build-${{ github.run_number }}
        run: MACGRUBER_PACKAGE_ARCH=${{ matrix.arch }} ./scripts/package-release.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: macgrubernetes-build-${{ github.run_number }}-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish multi-architecture release
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: macgrubernetes-build-${{ github.run_number }}-*
          path: dist
          merge-multiple: true

      - name: Create build-numbered release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Macgrubernetes build ${{ github.run_number }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
