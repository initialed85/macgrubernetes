name: Macgrubernetes CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-14
    steps:
      - name: Check out Macgrubernetes
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: false

      - name: Set up Rust target
        run: rustup target add aarch64-apple-darwin

      - name: Validate shell scripts
        run: for script in scripts/*.sh; do bash -n "$script"; done

      - name: Test pinned components
        run: make test

      - name: Build Darwin/arm64 bundle
        run: make build
