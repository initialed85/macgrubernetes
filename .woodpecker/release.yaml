# Build-and-publish on every push to master — the port of .github/workflows/release.yml (deleted in the same
# commit). This one runs on the darwin lane (workflow-level labels) because the bundle is four Mach-O
# binaries plus the Longhorn NFS gateway handoff files, and one of them (Skopeo) is Rust linked against the
# macOS SDK; the Linux pool cannot link that.
#
# How the Actions shape maps onto Woodpecker here:
#
# - The arch matrix collapses to one leg. The Actions workflow built arm64 and amd64; only arm64 ships now,
#   because the Intel/Catalina target is the too-hard basket (the old Intel MacBook never came back up) and a
#   bundle nobody has executed is an unproven artifact, not a product. The publish step still takes everything
#   in dist/, so adding Intel back later is a step, not a rewrite.
# - Both remaining steps share one workspace (the per-workflow PVC), so the publish step sees the archive the
#   build step wrote without upload/download-artifact. That is also why the legs are sequential rather than
#   multiplied: a Woodpecker matrix multiplies the whole workflow, which would run the publish step once per
#   leg and create two releases.
# - Both remaining steps run on this Apple Silicon host. What used to be the second arch leg was cross-
#   compiled here too - Go and Cargo produce x86_64-apple-darwin binaries on this machine - and that is
#   exactly why it was dropped rather than kept: the Intel bundle existed only to run on Catalina, and the
#   only thing that has ever executed it was a GitHub macos-15-intel runner, which costs an order of
#   magnitude more than this free host.
# - `softprops/action-gh-release` cannot run here at all: it is a Docker plugin, and the darwin agent uses
#   the local backend, which turns `image:` into a host binary and cannot resolve settings/from_secret. So
#   the publish step is `gh`, which is on the host but starts unauthenticated: the probe measured
#   `gh version 2.96.0` and `You are not logged into any GitHub hosts`, and the local backend redirects HOME
#   into a per-workflow directory anyway, so a host `gh auth login` could never be seen by a step. The
#   credential therefore arrives as GH_TOKEN, taken from the agent pod's env once the maclet build carrying
#   Ed's commit 1682606 (resolve env valueFrom secretKeyRef) is running on icarus-2.local, or from a host
#   file if that is not deployed yet. The step uses whichever exists and nothing else, and never prints it.
# - the `build-` plus run_number tag_name cannot be carried over literally: GitHub's run_number for this
#   repo counts every workflow run ever (it is already in the 40s), while Woodpecker's pipeline counter
#   restarts at 1 per repo. Deriving the next N from the build-N tags that exist keeps the numbering where
#   the old workflow left it, and it is the same rule scripts/update.sh uses for component versions. The tag
#   is created with `gh api .../git/refs` pointing at $CI_COMMIT_SHA rather than `git tag && git push`
#   because the host's git has no GitHub credential, while GH_TOKEN is in the environment.
# - generate_release_notes -> gh --generate-notes. `files: dist/*.tar.gz` -> shell globs on gh's argv, which
#   is what softprops expanded server-side.
# - The release *title* is kept ("Macgrubernetes build-N"), which is the one place the Linux-lane ports
#   could not follow: settings: is not expanded and cannot read a file, so wp-gh-release could not take a
#   derived title. On this lane gh is a shell command, so it can.
#
# VERSION here is the release string, not a semver: scripts/package-release.sh only requires it to be
# non-empty and uses it to name the archive, so build-N packages exactly like it did under Actions.
# labels is a workflow-level key in v3; on a step it is accepted for v2 compatibility and then ignored, so
# every step here routes through the same block rather than each one carrying its own copy.
labels:
  platform: darwin/arm64

steps:
  - name: resolve-build-number
    image: bash
    commands:
      # --paginate because the tag list is a paginated API and build-N is by construction the newest name;
      # missing a page would restart the numbering.
      # gh needs a credential in every step that calls it and step env does not survive into the next step,
      # so the fallback is repeated here rather than assumed.
      - test -n "$GH_TOKEN" || export GH_TOKEN=$(cat /Users/edwardbeech/.config/woodpecker-agent/github-token)
      - gh --version | head -n 1
      # The tag list goes to a file instead of straight into a pipe. macgrubernetes #3 had `gh: To use GitHub
      # CLI in automation, set the GH_TOKEN environment variable` in its log, the pipeline's exit status came
      # from jq, and the step "succeeded" by deriving build-1 on a repo that already has build-N tags. That
      # is the failure mode to avoid: a masked gh error publishes a colliding tag, it does not stop the run.
      - gh api "repos/$CI_REPO/tags?per_page=100" --paginate > tags.json
      # The leading build- has to come off before the arithmetic. $(( build-43 + 1 )) does not fail: bash
      # evaluates the word "build" as an unset variable, so it is 0 - 43 + 1 = -42, and macgrubernetes #4
      # derived the tag build--42, named its artifact macgrubernetes-build--42-darwin-arm64.tar.gz, and left
      # the resolve step green. macker's derivation already stripped the prefix; this port had dropped it.
      - jq -r '.[].name' tags.json | grep -E '^build-[0-9]+$' | sort -V | tail -n 1 | sed 's#^build-##' > build-number.txt
      - test -s build-number.txt || echo 0 > build-number.txt
      - mkdir -p .release && echo "build-$(( $(cat build-number.txt) + 1 ))" > .release/TAG
      - echo "publishing $(cat .release/TAG), derived from the tags that already exist"
      - jq -r '.[].name' tags.json | grep -E '^build-[0-9]+$' | sort -V | tail -n 3

  - name: build-arm64
    image: bash
    depends_on: [resolve-build-number]
    environment:
      # The whole step needs one build root, not just the make invocations. common.sh resolves a locked
      # component as $MACGRUBER_BUILD_ROOT/src/<component>, and macgrubernetes #3 set the variable per
      # command, so ./scripts/update.sh, make test and make build used .build/arm64 while the packaging
      # script fell back to the default and died with: locked component is not synced:
      # longhorn-nfs-gateway (run make sync). The GHA set it once for the job; this is the same thing.
      MACGRUBER_GOARCH: arm64
      MACGRUBER_RUST_TARGET: aarch64-apple-darwin
      MACGRUBER_MACOSX_DEPLOYMENT_TARGET: ""
      MACGRUBER_BUILD_ROOT: .build/arm64
    commands:
      - rustup target add aarch64-apple-darwin
      # scripts/update.sh is deliberately NOT run here, and this is the one place the port changes behaviour
      # rather than translating it. It resolves the highest build-* tag in each component repo at run time and
      # rewrites the *tracked* components.lock (MACGRUBER_LOCKFILE defaults to $MACGRUBER_ROOT/components.lock,
      # scripts/common.sh:6), and nothing in this pipeline commits the result back. So build-48 shipped
      # `macker build-19` in its bundle while the repo it was cut from still said `build-13`: the release was
      # not reproducible from its own lock, and the mutated tracked file was another reason go build stamped
      # +dirty. GitHub Actions ran the same script, so the drift predates this port - build-48 is where it was
      # first caught because build-48 is the first release whose lock could be diffed against a commit. The
      # committed lock is now the contract: bump a component by running ./scripts/update.sh locally and
      # committing what it writes, never as a side effect of publishing.
      - cat components.lock
      - make test
      - make build arch=arm64
      - file .build/arm64/bin/*
      - env MACGRUBER_PACKAGE_ARCH=arm64 VERSION=$(cat .release/TAG) ./scripts/package-release.sh
      # Record the toolchain that produced the bundle, as a release asset rather than bundle content, so it
      # cannot change a byte of what a node installs. The lane pins no Go, Rust or clang and the darwin agent
      # resolves image to a host binary, so this build uses whatever the Mac happens to have: a Homebrew go
      # upgrade or an Xcode point release moves every binary in the bundle while not one file in the repo
      # differs. That is the difference between "the host has been static" and "the lane is
      # toolchain-independent", and six identical releases only prove the first. Taken here, in the step that
      # ran the compiler, because a later container would measure a different environment. Each probe is
      # guarded: a missing tool is recorded as none, which is itself a fact about the host.
      - |
        TAG=$(cat .release/TAG)
        {
          echo "tag: $TAG"
          echo "commit: $CI_COMMIT_SHA"
          echo "host: $(uname -sr)"
          printf 'go: '; go version 2>/dev/null || echo none
          printf 'rustc: '; rustc -V 2>/dev/null || echo none
          printf 'cargo: '; cargo -V 2>/dev/null || echo none
          printf 'cc: '; cc --version 2>/dev/null | head -1 || echo none
          printf 'sdk: '; xcrun --show-sdk-version 2>/dev/null || echo none
          # tar belongs in the toolchain record because packaging behaviour is now chosen by which options
          # the local tar accepts, so a bsdtar or GNU tar change alters bundle bytes with no source change
          # and no toolchain line to explain it. Same hole, already closed for the compilers.
          printf 'tar: '; tar --version 2>/dev/null | head -1 || echo none
        } > dist/toolchain-$TAG.txt
        cat dist/toolchain-$TAG.txt

  # Advisory, and it exits 0 whatever it finds. Why it exists: build-52 through build-55 have byte-identical
  # bundles because the commits between them touched the installer and comments, and that is only visible
  # because I compared the releases by hand. The failure mode worth catching is the opposite - a bundle that
  # moves with no commit that explains it - which is what a runner toolchain upgrade or a build script picking
  # up a floating dependency would look like, and it would currently surface as a node that will not reproduce
  # a release, discovered later, on a Mac.
  #
  # Why advisory rather than a gate: a gate with a known false-positive rate gets disabled the first time it
  # fires on someone mid deploy, which is worse than no gate, and the two things that legitimately move a
  # bundle are a source change and a runner toolchain change, so the report carries both (see the toolchain
  # asset above) rather than assuming the second is impossible. It reports on every run, so it is never a
  # safeguard that has only been seen declining to act, and it prints INCONCLUSIVE rather than a bare
  # "skipping" when it cannot compare, because a verdict indistinguishable from silence is not a check.
  - name: determinism-report
    image: bash
    depends_on: [build-arm64]
    commands:
      - test -n "$GH_TOKEN" || export GH_TOKEN=$(cat /Users/edwardbeech/.config/woodpecker-agent/github-token)
      # One line, not several: the steps above already re-read .release/TAG per command rather than trusting
      # a variable across commands, and $package_name is a variable from the packaging script, not this one.
      # Everything the report needs is resolved here, against the packaged tarball rather than .build/arm64,
      # because that is the thing a node actually receives - the build root holds bin/ but not the launcher,
      # README, components.lock copy or gateway files the packaging step assembles, and hashing it would
      # report five missing files on both sides and look like a verdict.
      #
      # The prefix strip is guarded for the same reason the build-number step documents it: $(( v0.1.3 - 1 ))
      # does not fail loudly, it evaluates to a number, and an unanchored build- prefix once produced build--42.
      # Braced expansion of a shell-local variable is the trap. The config-time substitution runs over the
      # raw workflow text, comments included, and only the BRACED form is evaluated, so the braced prefix
      # strip of TAG used here before became an empty string and the line turned into
      # `PREV=build-$(( - 1 ))`, which is valid bash and produced build--1. Measured on this lane's first
      # run, build-56: the report printed INCONCLUSIVE - could not fetch build--1 and exited 0, so a check
      # comparing nothing looked like a run that had simply found nothing to compare against. That is why
      # the skip paths say INCONCLUSIVE rather than skipping. Keep the strip unbraced, and note that a
      # braced form in a comment is substituted too, which is how macker #3 died.
      - TAG=$(cat .release/TAG); pkg=macgrubernetes-$TAG-darwin-arm64; rm -rf .det; mkdir -p .det/current; tar -xzf "dist/$pkg.tar.gz" -C .det/current; case "$TAG" in build-*) PREV=build-$(( $(printf '%s' "$TAG" | sed 's/^build-//') - 1 ));; *) PREV="";; esac; TAG=$TAG PREV_TAG=$PREV MACGRUBER_BUILD_ROOT=.det/current/$pkg MACGRUBER_REPO_DIR=$CI_WORKSPACE bash scripts/determinism-report.sh || echo "determinism CRASHED with a nonzero status and reported nothing. This step is advisory, so it does not block the release, but a crash is not a pass, and a report that always exits 0 by construction is a safeguard that has never been seen to do anything."

  - name: publish
    image: bash
    depends_on: [determinism-report]
    commands:
      # BSD wc pads its count with spaces - measured on icarus: ls /etc/protocols | wc -l writes seven spaces
      # then 1 - so the count must be squeezed before comparing, and this is another place where the Actions
      # version was fine because its runner ran GNU coreutils. Without tr, the publish step fails on a
      # perfectly good release with one artifact.
      - test "$(ls dist/*.tar.gz | wc -l | tr -d ' ')" = 1
      # GH_TOKEN from the agent pod if maclet resolved it, otherwise the host file the agent's own user owns
      - test -n "$GH_TOKEN" || export GH_TOKEN=$(cat /Users/edwardbeech/.config/woodpecker-agent/github-token)
      # the tag points at the commit this pipeline built; gh is the only thing here with a credential
      - gh api repos/$CI_REPO/git/refs -f ref="refs/tags/$(cat .release/TAG)" -f sha="$CI_COMMIT_SHA"
      - gh release create "$(cat .release/TAG)" dist/*.tar.gz dist/*.sha256 dist/toolchain-*.txt --generate-notes --title "Macgrubernetes $(cat .release/TAG)"
      - gh release view "$(cat .release/TAG)" --json tagName,assets --jq '"tag " + .tagName + " assets " + (.assets | length | tostring)'

  # A failed publish must not leave a tag that has no release behind it. The ref above is created before
  # `gh release create`, so a run can die in the middle and leave refs/tags/build-N pointing at this commit
  # with no assets: scripts/update.sh and any `git ls-remote` resolver treat the highest build-* tag as the
  # newest build, and a node told to install that build gets a loud 404. The release itself is never
  # published in that state (gh publishes only after the last upload finishes, which is why published_at
  # trails the tar's updated_at), so `releases/latest` keeps pointing at the previous good build and only
  # an explicit request for this build number can hit the hole. This step removes exactly what this pipeline
  # created: a draft release for our tag, or a ref for our tag with no release at all. A published release
  # is left alone even if the pipeline failed afterwards, and a tag whose sha is not this commit's is not
  # ours to delete.
  #
  # Tested rather than assumed. Until now this step had only ever been observed declining to act, which does
  # not distinguish a working safeguard from one that cannot fire -- the same shape as the bug it was
  # written after, where the first version was guarded by `status: [failure, error]`, an illegal value the
  # Go linter compiles away, so the cleanup would have silently never run. Branch ci/orphan-tag-test ran
  # all three states against the real API (pipeline #12, lane preserved in commit 329034f48de32dc00d27bab1214cf24444c12416,
  # resurrect with `git checkout 329034f -- '.woodpecker/orphan-*'` and push a branch of that name), and the
  # outcome was checked against GitHub rather than trusting the step's own log: a ref with no release was
  # deleted; a draft with a ref had both removed by --cleanup-tag, which is the state a real upload failure
  # actually leaves since gh creates the release object before it uploads; and a published release followed
  # by a failure kept both its tag and its assets. Tags were test-<case>-build-<run> so they could not
  # match the build-* pattern any resolver reads. Coverage is complete by construction, as the peer pointed
  # out: the ref is created inside the publish step, so ref-exists implies publish-ran, and a failure in
  # build-arm64 leaves no ref for this step to find. The messages name the branch taken and the action,
  # because a log that says "not touching the ref" immediately before a command that deletes it is read
  # as a contradiction by whoever is debugging a real failure at 2am.
  - name: clean-up-orphan-tag
    image: bash
    depends_on: [publish]
    when:
      - status: [failure]
    commands:
      # Nothing to clean if the run died before the build number was resolved.
      - test -f .release/TAG || exit 0
      - test -n "$GH_TOKEN" || export GH_TOKEN=$(cat /Users/edwardbeech/.config/woodpecker-agent/github-token)
      - TAG=$(cat .release/TAG); if gh release view "$TAG" --json isDraft >/dev/null 2>&1; then echo "$TAG has a release object; leaving the ref alone, the next line decides whether that release is an orphan draft"; else echo "$TAG has no release; deleting the ref this pipeline created"; gh api -X DELETE "repos/$CI_REPO/git/refs/tags/$TAG" || echo "no ref to delete"; fi
      - TAG=$(cat .release/TAG); if test "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = true; then echo "draft release for $TAG exists, removing it and refs/tags/$TAG together"; gh release delete "$TAG" --yes --cleanup-tag; else echo "$TAG is not a draft, so it is a real release; leaving it"; fi

when:
  - event: push
    branch: master
